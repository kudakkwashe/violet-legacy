<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vio leg</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #081a11;
        }

        /* Scene container sets the void background */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: hidden;
            background: #081a11;
        }

        /* Cinematic vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        /* Main stage holds the image, with a soft fade mask so edges melt into the black void */
        .card-stage {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;

            background-color: #081a11;
            background-image: url('mainhero.JPG');
            background-size: 92%;
            background-position: center 42%;
            background-repeat: no-repeat;

            /* This fades the outer edges of the image into transparent black, 
               letting the solid #081a11 body/scene background create a seamless black bleed */
            -webkit-mask-image: radial-gradient(circle at center, black 65%, transparent 100%);
            mask-image: radial-gradient(circle at center, black 65%, transparent 100%);
        }

        /* Typography elements positioned around the center with 3D depth */
        .nav-text {
            position: absolute;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 5;
            user-select: none;
            transform: translateZ(90px);
            transition: color 0.3s ease;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .nav-text:hover {
            color: #a8ffcc;
        }

        .text-main {
            left: 14vw;
            top: 48%;
            transform: translateY(-50%) translateZ(90px);
        }

        .text-main h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .text-main p {
            font-size: 0.85rem;
            letter-spacing: 3px;
            opacity: 0.9;
            font-weight: 400;
        }

        .text-store {
            right: 14vw;
            top: 48%;
            transform: translateY(-50%) translateZ(90px);
            text-align: right;
        }

        .text-store h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .text-store p {
            font-size: 0.85rem;
            letter-spacing: 3px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .card-stage { background-size: cover; -webkit-mask-image: none; mask-image: none; }
            .text-main { left: 6vw; top: 15%; }
            .text-store { right: 6vw; bottom: 10%; top: auto; text-align: left; }
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="vignette"></div>

        <div class="card-stage" id="stage">
            <!-- Left Navigation / Title -->
            <div class="nav-text text-main" onclick="location.href='#main'">
                <h1>ABOUT</h1>
                <p>VIOLET LEGACY</p>
            </div>

            <!-- Right Navigation / Title -->
            <div class="nav-text text-store" onclick="location.href='#store'">
                <h1>SHOP</h1>
                <p>ALL COLLECTION</p>
            </div>
        </div>
    </div>

    <script>
        const stage = document.getElementById('stage');

        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.08;
            currentY += (mouseY - currentY) * 0.08;

            const tiltX = currentY * -6;
            const tiltY = currentX * 6;

            stage.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
