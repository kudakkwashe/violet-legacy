
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PALACE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>

        /* =========================
           GLOBAL SETTINGS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #d1d5db;
            color: white;
            overflow-x: hidden;
        }

        /* =========================
           FULL SCREEN PAGE
        ========================= */

        .page-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            background: #d1d5db;
        }

        /* =========================
           BACKGROUND IMAGE
        ========================= */

       
.hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    background-color: #d1d5db;

    background-image: url("/violet-legacy/DSC00726.jpeg");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

        /* =========================
           TOP NAVIGATION BAR
        ========================= */

        .nav-container {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: max-content;
            max-width: calc(100% - 30px);
        }

        .nav-pill {
            background: #000000;
            border-radius: 70px;

            padding: 21px 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 32px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.2);

            white-space: nowrap;
        }

        .nav-logo {
            font-size: 31px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1.5px;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;

            gap: 30px;

            font-size: 17px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-links a {
            color: #b3b3b3;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
        }

        .nav-cart {
            color: #ffffff;
            text-decoration: none;

            font-size: 17px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* =========================
           LEFT SIDE MENU
        ========================= */

        .left-menu {
            position: absolute;

            top: 50%;
            left: 40px;

            bottom: auto;

            transform: translateY(-50%);

            z-index: 5;

            display: flex;
            flex-direction: column;

            gap: 9px;
        }

        .left-menu a {
            font-size: 25px;
            font-weight: 900;

            text-decoration: none;
            text-transform: uppercase;

            letter-spacing: 0.2px;

            color: #9ca3af;

            line-height: 1.35;

            transition: color 0.2s ease;
        }

        .left-menu a:hover {
            color: #ffffff;
        }

        .left-menu a.highlight {
            color: #5575ff;
        }

        /* =========================
           RIGHT SIDE VIEW BUTTON
        ========================= */

        .view-now-container {
            position: absolute;

            top: 50%;
            right: 40px;

            bottom: auto;

            transform: translateY(-50%);

            z-index: 5;
        }

        .view-btn {
            display: inline-block;

            background: #4361ee;
            color: #ffffff;

            font-size: 19px;
            font-weight: 900;

            text-transform: uppercase;
            letter-spacing: 1px;

            padding: 21px 32px;

            border-radius: 3px;

            text-decoration: none;

            box-shadow: 0 3px 12px rgba(0,0,0,0.3);

            transition: background 0.2s ease;
        }

        .view-btn:hover {
            background: #314ecc;
        }

        /* =========================
           TABLET RESPONSIVENESS
        ========================= */

        @media (max-width: 900px) {

            .nav-pill {
                padding: 15px 22px;
                gap: 18px;
            }

            .nav-logo {
                font-size: 23px;
            }

            .nav-links {
                font-size: 12px;
                gap: 17px;
            }

            .nav-cart {
                font-size: 12px;
            }

            .left-menu {
                left: 25px;
            }

            .left-menu a {
                font-size: 19px;
            }

            .view-now-container {
                right: 25px;
            }

            .view-btn {
                font-size: 14px;
                padding: 15px 21px;
            }
        }

        /* =========================
           MOBILE RESPONSIVENESS
        ========================= */

        @media (max-width: 600px) {

            .nav-container {
                top: 18px;
                max-width: calc(100% - 16px);
            }

            .nav-pill {
                padding: 11px 13px;
                gap: 10px;
            }

            .nav-logo {
                font-size: 14px;
            }

            .nav-links {
                gap: 9px;
                font-size: 8px;
            }

            .nav-cart {
                font-size: 8px;
            }

            .left-menu {
                left: 15px;
                top: 50%;
                bottom: auto;
                gap: 5px;
            }

            .left-menu a {
                font-size: 11px;
                line-height: 1.4;
            }

            .view-now-container {
                right: 15px;
                top: 50%;
                bottom: auto;
            }

            .view-btn {
                font-size: 9px;
                padding: 9px 12px;
            }
        }

    </style>
</head>

<body>

    <main class="page-container">

        <!-- BACKGROUND IMAGE -->

        <div class="hero-bg"></div>


        <!-- TOP NAVIGATION -->

        <nav class="nav-container">

            <div class="nav-pill">

                <span class="nav-logo">PALACE</span>

                <ul class="nav-links">

                    <li>
                        <a href="#" class="active">WEB SHOP</a>
                    </li>

                    <li>
                        <a href="#">STORES</a>
                    </li>

                    <li>
                        <a href="#">ADVICE</a>
                    </li>

                </ul>

                <a href="#" class="nav-cart">
                    CART 1
                </a>

            </div>

        </nav>


        <!-- LEFT SIDE COLLECTION MENU -->

        <div class="left-menu">

            <a href="#">MANOR PLACE</a>

            <a href="#" class="highlight">
                PALACE NIKE ENGLAND
            </a>

            <a href="#" class="highlight">
                AUTUMN 2026 RANGE
            </a>

            <a href="#">
                AUTUMN 2026 LOOKBOOK
            </a>

            <a href="#">
                PALACE JAMSIL
            </a>

        </div>


        <!-- RIGHT SIDE BUTTON -->

        <div class="view-now-container">

            <a href="#" class="view-btn">
                VIEW NOW
            </a>

        </div>

    </main>

</body>
</html>
