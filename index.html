<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violet Legacy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d2b1d;
        }

        /* Scene container with that lil 3D perspective */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b4d35 0%, #081a11 100%);
        }

        /* Vignette overlay to look cool */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            z-index: 10;
        }

        /* Main wrapper that tilts based on mouse position */
        .card-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Central Character / Visual Container (Updated to 16:9 Ratio) */
        .character-container {
            position: absolute;
            width: 65vw;
            height: calc(65vw * (9 / 16));
            max-width: 1100px;
            max-height: 618.75px;
            transform: translateZ(50px);
            transition: transform 0.1s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .character-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Typography elements positioned around the center */
        .nav-text {
            position: absolute;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 5;
            user-select: none;
            transform: translateZ(90px);
            transition: color 0.3s ease;
        }

        .nav-text:hover {
            color: #a8ffcc;
        }

        .text-main {
            left: 8vw;
            top: 48%;
            transform: translateY(-50%) translateZ(90px);
        }

        .text-main h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .text-main p {
            font-size: 0.9rem;
            letter-spacing: 3px;
            opacity: 0.8;
            font-weight: 400;
        }

        .text-store {
            right: 8vw;
            top: 48%;
            transform: translateY(-50%) translateZ(90px);
            text-align: right;
        }

        .text-store h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .text-store p {
            font-size: 0.9rem;
            letter-spacing: 3px;
            opacity: 0.8;
            font-weight: 400;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .text-main { left: 5vw; top: 12%; }
            .text-store { right: 5vw; bottom: 8%; top: auto; text-align: left; }
            .character-container { 
                width: 85vw; 
                height: calc(85vw * (9 / 16)); 
            }
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="vignette"></div>

        <div class="card-stage" id="stage">
            <!-- Left Navigation / Title -->
            <div class="nav-text text-main" onclick="location.href='#main'">
                <h1>MAIN</h1>
                <p>EVERYTHING</p>
            </div>

            <!-- Central Character Element (Linked to mainhero.jpg) -->
            <div class="character-container" id="character">
                <img src="mainhero.jpg" alt="Character" class="character-img" id="charImg">
            </div>

            <!-- Right Navigation / Title -->
            <div class="nav-text text-store" onclick="location.href='#store'">
                <h1>STORE</h1>
                <p>RIGHT HERE</p>
            </div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const stage = document.getElementById('stage');
        const character = document.getElementById('character');

        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.08;
            currentY += (mouseY - currentY) * 0.08;

            const tiltX = currentY * -15;
            const tiltY = currentX * 15;

            stage.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
            character.style.transform = `translateZ(60px) translateX(${currentX * -20}px) translateY(${currentY * -20}px)`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
