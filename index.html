<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violet Legacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0c0c0e;
            --text-primary: #f4f4f6;
            --text-muted: #94949b;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .landing-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 3rem;
            background-image: url('mainhero.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Subtle dark gradient overlay to ensure UI elements pop while keeping the photo clean */
        .landing-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(12, 12, 14, 0.75) 0%, rgba(12, 12, 14, 0.4) 50%, rgba(12, 12, 14, 0.75) 100%);
            z-index: 1;
            pointer-events: none;
        }

        header, nav, .bottom-left-nav, .top-right-nav, .hero-content {
            position: relative;
            z-index: 2;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-container img {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        .top-right-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .bag-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .bag-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .menu-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }

        .menu-toggle span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--text-primary);
            transition: var(--transition-smooth);
        }

        .menu-toggle:hover span {
            background-color: var(--text-muted);
        }

        /* Middle Area / Hero Content */
        .hero-middle {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 1rem;
        }

        /* Left side navigation links */
        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .side-nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            transition: var(--transition-smooth);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            width: fit-content;
        }

        .side-nav a:hover {
            color: var(--text-muted);
            transform: translateX(4px);
        }

        /* Center Action */
        .center-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            position: absolute;
            left: 50%;
            bottom: 3.5rem;
            transform: translateX(-50%);
        }

        .shop-btn {
            background: rgba(255, 255, 255, 0.95);
            color: #0c0c0e;
            border: none;
            padding: 0.9rem 2.4rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .shop-btn:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .landing-container {
                padding: 1.5rem;
            }
            .hero-middle {
                align-items: center;
                flex-direction: column;
                gap: 2rem;
            }
            .side-nav {
                align-items: center;
            }
            .center-action {
                position: relative;
                left: unset;
                bottom: unset;
                transform: none;
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="logo-container">
                <img src="Screenshot 2026-09-25 at 15.33.30.png" alt="Violet Legacy Logo">
            </div>
            <div class="top-right-nav">
                <button class="bag-btn" onclick="alert('Bag is empty')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    BAG (0)
                </button>
                <button class="menu-toggle" aria-label="Open navigation menu" onclick="alert('Menu opened')">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- Main Body / Hero Section -->
        <div class="hero-middle">
            <!-- Left Navigation Menu -->
            <nav class="side-nav">
                <a href="#new-drop">NEW DROP</a>
                <a href="#collections">COLLECTIONS</a>
                <a href="#size-guide">SIZE GUIDE</a>
                <a href="#sustainability">SUSTAINABILITY</a>
                <a href="#about">ABOUT</a>
            </nav>

            <!-- Bottom Center Action Button -->
            <div class="center-action">
                <button class="shop-btn" onclick="alert('Redirecting to shop...')">SHOP NOW</button>
            </div>
        </div>
    </div>

</body>
</html>
