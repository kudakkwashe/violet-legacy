<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vio leg</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #081a11;
        }

        /* Scene container */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #081a11;
        }

        /* Cinematic vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        /* Static card stage that holds the perfectly fitted background image */
        .card-stage {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #081a11;
            background-image: url('mainhero.JPG');
            /* 'contain' ensures the entire image fits on screen without cutting off any faces or edges */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Typography elements positioned around the center */
        .nav-text {
            position: absolute;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 5;
            user-select: none;
            transition: color 0.3s ease;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .nav-text:hover {
            color: #a8ffcc;
        }

        .text-main {
            left: 8vw;
            top: 48%;
            transform: translateY(-50%);
        }

        .text-main h1 {
            font-size: clamp(2rem, 4vw, 4rem);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .text-main p {
            font-size: 0.85rem;
            letter-spacing: 3px;
            opacity: 0.9;
            font-weight: 400;
        }

        .text-store {
            right: 8vw;
            top: 48%;
            transform: translateY(-50%);
            text-align: right;
        }

        .text-store h1 {
            font-size: clamp(2rem, 4vw, 4rem);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .text-store p {
            font-size: 0.85rem;
            letter-spacing: 3px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 900px) {
            .text-main { left: 5vw; top: 12%; transform: none; }
            .text-store { right: 5vw; bottom: 8%; top: auto; text-align: left; transform: none; }
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="vignette"></div>

        <div class="card-stage" id="stage">
            <!-- Left Navigation / Title -->
            <div class="nav-text text-main" onclick="location.href='#main'">
                <h1>ABOUT</h1>
                <p>VIOLET LEGACY</p>
            </div>

            <!-- Right Navigation / Title -->
            <div class="nav-text text-store" onclick="location.href='#store'">
                <h1>SHOP</h1>
                <p>ALL COLLECTION</p>
            </div>
        </div>
    </div>

</body>
</html>
