<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>vio leg</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #081a11;
            font-family: Arial, sans-serif;
        }

        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* BACKGROUND IMAGE */
        .background {
            position: absolute;
            width: 110%;
            height: 110%;
            top: -5%;
            left: -5%;

            object-fit: cover;
            object-position: center;

            transition: transform 0.1s ease-out;
        }

        /* DARK EDGES */
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;

            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.7);
        }

        /* TEXT */
        .nav-text {
            position: absolute;
            z-index: 3;

            color: white;
            cursor: pointer;

            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }

        .nav-text h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            letter-spacing: 4px;
            line-height: 1;
        }

        .nav-text p {
            margin-top: 8px;
            font-size: 0.9rem;
            letter-spacing: 3px;
        }

        .nav-text:hover {
            color: #a8ffcc;
        }

        .text-main {
            left: 14vw;
            top: 48%;
            transform: translateY(-50%);
        }

        .text-store {
            right: 14vw;
            top: 48%;
            transform: translateY(-50%);
            text-align: right;
        }

        /* MOBILE */
        @media (max-width: 900px) {

            .text-main {
                left: 6vw;
                top: 15%;
            }

            .text-store {
                left: 6vw;
                right: auto;
                top: auto;
                bottom: 10%;
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <div class="scene" id="scene">

        <!-- CHANGE THIS FILE NAME IF NEEDED -->
        <img 
            src="mainhero.JPG" 
            class="background" 
            id="background"
            alt=""
        >

        <div class="vignette"></div>

        <div class="nav-text text-main" onclick="location.href='#main'">
            <h1>ABOUT</h1>
            <p>VIOLET LEGACY</p>
        </div>

        <div class="nav-text text-store" onclick="location.href='#store'">
            <h1>SHOP</h1>
            <p>ALL COLLECTION</p>
        </div>

    </div>

    <script>

        const background = document.getElementById("background");

        let mouseX = 0;
        let mouseY = 0;

        let currentX = 0;
        let currentY = 0;

        window.addEventListener("mousemove", function(e) {

            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;

        });

        function animate() {

            currentX += (mouseX - currentX) * 0.08;
            currentY += (mouseY - currentY) * 0.08;

            const rotateX = currentY * -5;
            const rotateY = currentX * 5;

            background.style.transform =
                `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.08)`;

            requestAnimationFrame(animate);
        }

        animate();

    </script>

</body>
</html>
